# Week manifest for the SQL track. Same shape as the C++ weeks; `track` is what puts it
# on the other side of the switcher.
#
# Day ids are prefixed because they must be unique across *every* week in the repo, not
# just within one: progress, review cards and mentor chat threads are all flat maps
# keyed by day id, so two weeks both calling a day "day-01" merges them into a single
# record. build-content.mjs fails the build if that ever happens again.
#
# Teasers are hooks, not tables of contents. "pages, ctid, VACUUM" says nothing the title
# doesn't; "why VACUUM gave back none of the 4 GB" makes someone open it.
id: week-sql-01
title: What the Database Does
milestone: sql-01-what-the-database-does
track: sql
intro: >
  If you write SQL that works but have never looked at what the engine does with it, this
  is the layer underneath. Everything runs against PostgreSQL 16 — the engine most likely
  to be under whatever you build next, and one of the few that will hand you a raw page
  and tell you what is on it. A container and a psql prompt is the whole setup.

days:
  - id: sql-day-01
    day: 1
    title: A table is a file of pages
    estMinutes: 25
    teaser: Your UPDATE didn't update anything, and VACUUM gave back none of the 4 GB
    teachBack: >
      A page is the unit of I/O, and an UPDATE writes a new version of the row rather
      than editing it. Put those two facts together and explain why a table can triple in
      size while its row count stays flat — and what plain VACUUM does about it, given
      that it does not shrink the file.

  - id: sql-day-02
    day: 2
    title: An index is a sorted copy
    estMinutes: 30
    teaser: Same index, same query, one word different — and the planner refuses it
    teachBack: >
      An index is a second sorted tree, not an annotation on the table. Use that to
      explain both why `WHERE lower(email) = ?` cannot use an index on `email`, and why a
      planner that has a perfectly usable index will sometimes choose to ignore it and be
      right to.

  - id: sql-day-03
    day: 3
    title: NULL is not a value
    estMinutes: 25
    teaser: The query that returned zero rows for two years and never logged an error
    teachBack: >
      Walk through why `x NOT IN (1, 2, NULL)` returns nothing for every possible `x`.
      Expand the expression, say what each term evaluates to, and explain why `WHERE`
      then drops the row — including why it drops it silently rather than erroring.
