# Week manifest for the SQL track. Same shape as the C++ weeks; `track` is what puts it
# on the other side of the switcher.
#
# Teasers are hooks, not tables of contents. "pages, page_size, page_count" says nothing
# the title doesn't; "why one row costs 4KB" makes someone open it.
id: week-sql-01
title: What the Database Does
milestone: sql-01-what-the-database-does
track: sql
intro: >
  If you write SQL that works but have never looked at what the engine does with it,
  this is the layer underneath. Everything here runs in sqlite3 — one binary, no server —
  so the whole track fits on whatever machine you happen to have open.

days:
  - id: day-01
    day: 1
    title: A table is a file of pages
    estMinutes: 25
    teaser: Why reading one row costs four kilobytes, and the hidden column you already have
    teachBack: >
      A page is the unit of I/O. Explain what that means for a query that returns a
      single narrow row from a large table — what does the engine actually read, and
      what would have to be true for it to read less?

  - id: day-02
    day: 2
    title: An index is a sorted copy
    estMinutes: 30
    teaser: Your index exists, the column is right, and the plan still says SCAN. Three reasons why.
    teachBack: >
      An index is a second sorted tree, not an annotation. Use that to explain both why
      `WHERE lower(email) = ?` can't use an index on `email`, and why the fix is an index
      on the expression rather than on the column.

  - id: day-03
    day: 3
    title: NULL is not a value
    estMinutes: 25
    teaser: The query that returned zero rows for two years and never logged an error
    teachBack: >
      Walk through why `x NOT IN (1, 2, NULL)` returns nothing for every possible `x`.
      Expand the expression, say what each term evaluates to, and explain why `WHERE`
      then drops the row.
