# Answer key for day 01. Kept out of the .md on purpose — that file is the one open
# while the lesson is being done.
#
# Option order here carries no information: build-content.mjs shuffles each question
# deterministically, so authoring the correct one first is safe.
questions:
  - id: q1
    prompt: >
      A table has 200 rows packed into 6 pages. A query returns exactly one row, found by
      scanning. What is the smallest amount of data the engine could have read from disk?
    options:
      - text: One page — 8 kB in PostgreSQL
        correct: true
        why: >
          The page is the unit of I/O. Even a single-byte column in a single row costs
          one whole page, because a page is the smallest thing the engine can ask the
          filesystem for.
      - text: Just the bytes of that row
        correct: false
        why: >
          Nothing in the stack can read a partial page. The row's bytes arrive inside the
          page that holds them; you never pay per row.
      - text: All six pages, since a scan reads the whole table
        correct: false
        why: >
          A scan *may* read every page, but it can stop the moment it has what it needs.
          The question asks for the smallest possible, and that is the one page the row
          sits on.
      - text: It depends entirely on the row's width
        correct: false
        why: >
          Width changes how many rows fit per page, not the size of a read. A 20-byte row
          and a 2000-byte row both cost one page to reach.

  - id: q2
    prompt: >
      You run `UPDATE t SET note = 'x' WHERE id = 1` in PostgreSQL. What happens to the
      row's physical location, and to the previous version of the row?
    options:
      - text: >
          A new version of the row is written elsewhere — possibly on a different page —
          and the old version stays in the file, marked dead
        correct: true
        why: >
          This is MVCC. An UPDATE is an insert plus a tombstone, never an edit in place.
          Watch `ctid` change across the statement and you have seen it happen; the dead
          version is still on disk until a vacuum reclaims its space.
      - text: >
          The row's bytes are overwritten where they sit, so the ctid is unchanged
        correct: false
        why: >
          That would break the property Postgres is built around: a concurrent reader
          holding an older snapshot must still be able to see the previous version. It
          cannot, if you overwrote it. The old version has to survive the update.
      - text: >
          The old version is deleted immediately and the new one takes its slot
        correct: false
        why: >
          Immediate deletion has the same problem — a transaction that started before
          your update is entitled to keep reading the old version. Reclaiming that space
          is a *later*, separate job, which is exactly what VACUUM is for.
      - text: >
          The row moves only if the new value is longer than the old one
        correct: false
        why: >
          Length is irrelevant to whether a new version is written; a new version is
          always written. It can influence *where* the new version lands, but even
          shrinking a value produces a second copy.

  - id: q3
    prompt: >
      Your table's file is 4 GB on disk, of which only 500 MB is live rows. You run
      `VACUUM`. What happens to the size of the file, and why?
    options:
      - text: >
          It stays 4 GB — VACUUM marks the dead space reusable by that table but does not
          return it to the operating system
        correct: true
        why: >
          This is the most misunderstood thing in Postgres operations. Plain VACUUM stops
          the file from growing further, because new rows fill the freed space, but the
          file only shrinks if free space happens to sit at the very end. To actually get
          the 3.5 GB back you need VACUUM FULL, which rewrites the table into a new file
          under an ACCESS EXCLUSIVE lock — or pg_repack, which does it without the lock.
      - text: It drops to roughly 500 MB, since that is what is still live
        correct: false
        why: >
          That is VACUUM FULL's behaviour, not VACUUM's, and the distinction matters
          precisely when a disk is filling up. Plain VACUUM never rewrites the file.
      - text: It grows, because VACUUM writes bookkeeping about what it freed
        correct: false
        why: >
          VACUUM does write — it touches the visibility map and the free space map — but
          those are separate small forks, not growth of the table's own file.
      - text: >
          It stays 4 GB, and the dead space is permanently wasted until the table is
          dropped
        correct: false
        why: >
          Half right, and the wrong half matters. The space is not wasted: it is on the
          free space map and the next inserts and updates will land in it. That is why a
          well-vacuumed table reaches a steady size instead of growing forever.

  - id: q4
    prompt: >
      In PostgreSQL an index entry points at a physical `(page, slot)` address. Given
      only that, why can updating one *unindexed* column of a row cause writes to five
      different indexes?
    options:
      - text: >
          The update writes the row at a new physical address, so every index that points
          at the old address has to be given the new one
        correct: true
        why: >
          The indexes are not stale because of what the column meant — they are stale
          because of where the row *is*. This write amplification was Uber's headline
          reason for migrating off Postgres in 2016. InnoDB dodges it by having secondary
          indexes point at the primary key rather than a location, paying an extra lookup
          on every index read instead.
      - text: Postgres rebuilds all indexes on a table whenever any row in it changes
        correct: false
        why: >
          Nothing so drastic — the work is per-row, not per-table. A single-row update
          adds one entry per index, which is bad enough at scale but is not a rebuild.
      - text: >
          Each index stores a copy of the whole row, so all copies must be kept in sync
        correct: false
        why: >
          An index stores its own key columns plus a pointer, not the whole row. If it
          stored the whole row, updating an indexed column would be the expensive case —
          but here the expensive case is updating an *unindexed* one.
      - text: >
          It cannot — Postgres skips indexes whose columns did not change
        correct: false
        why: >
          There is an optimisation in this direction, HOT (heap-only tuple) updates, but
          it only applies when the new version fits on the *same page*. Once the row has
          to move to another page, every index must be updated.

  - id: q5
    prompt: >
      What are the hidden `xmin` and `xmax` columns on a PostgreSQL row, and how do they
      let one transaction read a table while another rewrites it?
    options:
      - text: >
          The transaction that created this row version and the one that deleted it — so
          each transaction can filter to the versions that were live when it started
        correct: true
        why: >
          Visibility is a comparison, not a lock. Your transaction has a snapshot; a row
          version is visible if its xmin committed before that snapshot and its xmax did
          not. Since every writer creates new versions rather than editing old ones, the
          versions your snapshot needs are still sitting there.
      - text: The minimum and maximum values of the row's indexed columns
        correct: false
        why: >
          They have nothing to do with your data. The x stands for transaction (xact);
          both hold transaction ids, and they are the same on a row whose columns are
          entirely unrelated.
      - text: Timestamps recording when the row was inserted and last modified
        correct: false
        why: >
          Tempting, and they are used for ordering — but they are transaction ids, not
          times. That distinction is why they can run out: they are 32-bit counters, and
          the ceiling of about two billion is what makes wraparound a real operational
          hazard.
      - text: >
          A read lock and a write lock held on the row while a transaction touches it
        correct: false
        why: >
          Backwards — these fields exist so that locks are *not* needed for reading.
          Postgres's readers-never-block-writers property comes precisely from resolving
          visibility by comparing ids rather than by taking a lock.
