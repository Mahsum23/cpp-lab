# Answer key for day 02. Question text lives in the .md; the reasoning lives here.
#
# Option order carries no information — build-content.mjs shuffles each question
# deterministically, so authoring the correct one first is safe.
questions:
  - id: q1
    prompt: >
      You add an index to speed up a slow report. Name two distinct costs you have just
      taken on.
    options:
      - text: >
          Every write to the table now maintains a second tree, and the index occupies
          real disk space of its own
        correct: true
        why: >
          Those are the two standing costs, and neither is small. Two single-column
          indexes on a three-column 50,000-row table came to 1544 kB each against a
          4552 kB table — two thirds of the table's size, for two columns. And in
          PostgreSQL the write cost is worse than it first looks: because index entries
          hold a physical row location, an UPDATE that moves a row must touch every index
          on the table, not just the ones on columns you changed.
      - text: Reads of other columns get slower, because the row is now split in two
        correct: false
        why: >
          The row is not split. The index is an additional copy of the indexed columns;
          the heap still holds every column exactly as before, and reads that ignore the
          index are unaffected.
      - text: The table must be locked whenever the index is used
        correct: false
        why: >
          Reading through an index takes no special lock. There is a locking cost to
          *building* one — which is why CREATE INDEX CONCURRENTLY exists — but that is a
          one-off, not a cost of having the index.
      - text: Queries that do not use the index have to skip past it while scanning
        correct: false
        why: >
          An index is a separate file. A sequential scan of the table never reads it and
          never steps over it.

  - id: q2
    prompt: >
      A query filters on an indexed column and the plan still shows `Seq Scan`, even
      though the index exists and the column is right. Give two different reasons that
      can happen.
    options:
      - text: >
          The filter wraps the column in a function or a cast, or the value matches so
          many rows that scanning is genuinely cheaper
        correct: true
        why: >
          Two entirely different failures that produce the identical symptom. The first
          is a correctness limit — an index on `name` is sorted by `name`, so it can say
          nothing about `lower(name)`. The second is the planner being right: fetching
          198,000 of 200,000 rows through an index means 198,000 random heap jumps, and
          reading the table straight through beat it by more than 10x in the lesson's
          measurement.
      - text: >
          The index has not finished building, or the table has too few rows for an index
          to exist
        correct: false
        why: >
          An unfinished CREATE INDEX is simply not visible to the planner yet, so this is
          not really a case of an index being ignored. And no row-count threshold governs
          whether an index can exist — small tables just rarely benefit.
      - text: >
          The column is nullable, and PostgreSQL cannot index columns that contain NULLs
        correct: false
        why: >
          PostgreSQL B-trees do index NULLs, and `WHERE col IS NULL` can use an index.
          (This is a real difference between engines — Oracle's B-trees famously omit
          all-NULL keys — but it is not why Postgres would choose a Seq Scan.)
      - text: The statistics are stale, which makes the index physically unusable
        correct: false
        why: >
          Stale statistics are a genuine and very common cause of a bad plan — but they
          mislead the planner's *estimate*, they do not make an index unusable. Run
          ANALYZE and the same index may suddenly be chosen for the same query.

  - id: q3
    prompt: >
      What does `Index Only Scan` mean in a PostgreSQL plan, what work does it save, and
      what can still force it to touch the heap anyway?
    options:
      - text: >
          The index carried every column the query needed, so the heap lookup was
          skipped — except for pages the visibility map has not marked all-visible
        correct: true
        why: >
          The saving is the second lookup: index entry to row. The catch is that an index
          holds no visibility information, so Postgres must still establish that each row
          is visible to your transaction. It uses the visibility map, one bit per page,
          and any page not marked forces a heap fetch after all. EXPLAIN ANALYZE prints
          `Heap Fetches:` — a large number there usually means the table wants vacuuming.
      - text: The whole index was loaded into memory, so no disk reads were needed
        correct: false
        why: >
          "Only" describes which structures were consulted, not where they live. An
          Index Only Scan still reads index pages from disk if they are not cached.
      - text: >
          The query was answered from the index because the table itself was locked by
          another transaction
        correct: false
        why: >
          Plan choice has nothing to do with locks held elsewhere. The planner picks this
          shape purely because the index happens to contain every column required.
      - text: >
          Only one index was used, rather than combining several
        correct: false
        why: >
          Combining indexes is a real Postgres capability, but it shows up as a BitmapAnd
          or BitmapOr over Bitmap Index Scans. "Index Only" refers to not visiting the
          heap.

  - id: q4
    prompt: >
      Your table has an index on `email`. Which of `WHERE email = ?`,
      `WHERE lower(email) = ?` and `WHERE email LIKE 'a%'` can use it, and what decides
      the last one?
    options:
      - text: >
          Equality yes; `lower(email)` no, without an index on the expression; `LIKE 'a%'`
          only if the index's collation is `C` or it uses `text_pattern_ops`
        correct: true
        why: >
          The first two follow from the index being sorted by `email` and nothing else.
          The third is the subtle one: turning `LIKE 'a%'` into the range `>= 'a' AND
          < 'b'` is only valid if the sort order is bytewise. A locale-aware collation
          may interleave strings so that the prefix matches are not contiguous — and
          `C.UTF-8` counts as locale-aware, despite the name.
      - text: All three, since all three mention only the indexed column
        correct: false
        why: >
          Mentioning the column is not the test. The test is whether the query's condition
          can be expressed as a range over the *order the index is sorted in* — which
          `lower(email)` cannot be, at any collation.
      - text: >
          Only the equality one; B-trees answer equality and nothing else
        correct: false
        why: >
          B-trees are excellent at ranges — that is what being sorted buys you. `>`, `<`,
          `BETWEEN` and `ORDER BY` all use them, and a prefix `LIKE` is a range in
          disguise when the collation permits.
      - text: >
          Equality and `LIKE 'a%'`; `lower(email)` works too once the statistics are
          refreshed
        correct: false
        why: >
          ANALYZE cannot help here. There is no entry anywhere in an index on `email`
          that records what `lower(email)` is, so no amount of better estimation makes
          that index answer the question. You need a second index, on the expression.

  - id: q5
    prompt: >
      `EXPLAIN` says a query will return 3 rows; `EXPLAIN ANALYZE` shows it actually
      returned 40,000. What is most likely wrong, and what does the planner do with a bad
      estimate?
    options:
      - text: >
          The statistics are stale or unrepresentative — and since the estimate is what
          chooses the plan, a wrong one picks a plan suited to a query that does not exist
        correct: true
        why: >
          This gap is where nearly every planner mystery is solved, which is why you reach
          for EXPLAIN ANALYZE rather than EXPLAIN. Believing three rows, the planner
          happily picks an index scan or a nested loop; at 40,000 rows those become
          40,000 random jumps or 40,000 inner scans. ANALYZE after a bulk load is the
          first thing to try, and correlated columns — where the planner assumes
          independence and is wrong — are the next suspect.
      - text: >
          Nothing is wrong; `EXPLAIN` reports rows examined and `EXPLAIN ANALYZE` reports
          rows returned
        correct: false
        why: >
          Both report the same quantity: rows emitted by that node. One is the planner's
          estimate and the other is the measured truth, which is exactly why comparing
          them is useful.
      - text: The query changed between the two runs, so the numbers are not comparable
        correct: false
        why: >
          EXPLAIN ANALYZE plans and executes the same statement, so the estimate and the
          actual come from one run. They are directly comparable by design.
      - text: >
          The planner notices the discrepancy mid-execution and re-plans with the real
          number
        correct: false
        why: >
          PostgreSQL does not re-plan mid-execution; the plan is fixed before the first
          row is produced, and a bad estimate is lived with to the end. Adaptive
          re-planning of this kind exists in some other systems, but assuming it here is
          how people conclude a plan "should have fixed itself".
