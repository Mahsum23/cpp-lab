setup: |
  CREATE TABLE logins (id int, at timestamptz);
  INSERT INTO logins VALUES
    (1, '2026-06-01 09:00+00'),
    (2, '2026-06-07 23:59:59.5+00'),
    (3, '2026-06-08 00:00:00+00'),
    (4, '2026-06-08 10:00+00');

challenges:
  - id: whole-week
    prompt: >
      The ids of the logins in the week of 1–7 June, **including everything on the 7th**
      and nothing from the 8th. Ordered by id. `BETWEEN` can't express this.
    hint: Inclusive start, exclusive end — the end is the start of the next day.
    solution: |
      SELECT id FROM logins
      WHERE at >= '2026-06-01' AND at < '2026-06-08'
      ORDER BY id;

  - id: wall-clock
    prompt: >
      What did a wall clock in Tashkent (`'Asia/Tashkent'`) show at the instant
      `2026-03-29 12:00:00+00`? Return it as a plain timestamp, without a time zone.
    hint: One operator converts an instant to the wall-clock time in a named zone.
    solution: |
      SELECT timestamptz '2026-03-29 12:00:00+00' AT TIME ZONE 'Asia/Tashkent' AS wall_clock;

  - id: pinned-day
    prompt: >
      Cut the instant `2026-06-01 22:30+00` down to the start of its day **in UTC**, so
      the answer doesn't depend on the session's time zone. Pass the zone explicitly.
    hint: "`date_trunc` takes an optional third argument."
    solution: |
      SELECT date_trunc('day', timestamptz '2026-06-01 22:30+00', 'UTC') AS utc_day;

  - id: month-clamp
    prompt: >
      The date one month after 31 January 2026, returned as a `date` — not a timestamp.
    hint: Add an interval, then cast the result back down.
    solution: |
      SELECT (date '2026-01-31' + interval '1 month')::date AS next_month;
