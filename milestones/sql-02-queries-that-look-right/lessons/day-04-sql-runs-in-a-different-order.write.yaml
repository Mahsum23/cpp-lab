setup: |
  CREATE TABLE orders (
    id       int PRIMARY KEY,
    customer text NOT NULL,
    status   text NOT NULL,
    amount   numeric(10,2) NOT NULL
  );
  INSERT INTO orders VALUES
    (1, 'ana', 'paid',      120.00),
    (2, 'ana', 'paid',       40.00),
    (3, 'bo',  'cancelled', 500.00),
    (4, 'bo',  'paid',       30.00),
    (5, 'cy',  'paid',       90.00),
    (6, 'cy',  'paid',       25.00);

challenges:
  - id: big-spenders
    prompt: >
      Which customers have **paid** more than 150 in total? Return `customer` and
      `total`, ordered by customer. Cancelled orders must not count towards the sum.
    hint: A condition about one row and a condition about a group go in different clauses.
    solution: |
      SELECT customer, sum(amount) AS total
      FROM orders
      WHERE status = 'paid'
      GROUP BY customer
      HAVING sum(amount) > 150
      ORDER BY customer;

  - id: filter-an-alias
    prompt: >
      Return `id` and `gross` (the amount times 1.2) for the orders whose gross is over
      100, highest first. `WHERE gross > 100` is an error, so find the way around it
      that filters the alias itself.
    hint: Wrap the query that creates the alias, and filter from outside.
    solution: |
      SELECT id, gross
      FROM (SELECT id, amount * 1.2 AS gross FROM orders) o
      WHERE gross > 100
      ORDER BY gross DESC;

  - id: zero-not-null
    prompt: >
      Return the total amount of orders over 1000, as a single value that is `0` when
      there are none — not NULL.
    hint: The sum of no rows is NULL. Something returns its first non-NULL argument.
    solution: |
      SELECT coalesce(sum(amount), 0) AS total FROM orders WHERE amount > 1000;

  - id: per-customer
    prompt: >
      Return each customer and how many orders they have, most orders first, ties
      broken by customer name.
    hint: Two sort keys, the second one only matters on ties.
    solution: |
      SELECT customer, count(*) AS orders
      FROM orders
      GROUP BY customer
      ORDER BY orders DESC, customer;
