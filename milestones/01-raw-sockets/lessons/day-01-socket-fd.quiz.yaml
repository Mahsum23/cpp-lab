# Answer key for day-01. Deliberately NOT in the .md — that's the file you'd open
# while doing the lesson. Distractors are real misconceptions, not filler.
#
# Option order here is authoring order and means nothing: build-content.mjs shuffles
# each question deterministically, so writing the correct one first is fine and the
# learner still can't pattern-match on position.
questions:
  - id: q1
    prompt: What does it mean if socket() returns -1 versus returning 3?
    options:
      - text: "-1 is failure and errno says why; 3 is a valid fd — the lowest free slot in the table"
        correct: true
        why: >
          Both halves matter. -1 is a sentinel meaning "look at errno" — the specific
          reason (EMFILE, ENFILE, EACCES, EAFNOSUPPORT) lives there, not in the return
          value. And 3 isn't arbitrary: POSIX guarantees the lowest available fd, and
          0/1/2 are already stdin/stdout/stderr, so a first socket in a normal process
          is almost always 3.
      - text: "-1 means no client has connected yet; 3 means one has"
        correct: false
        why: >
          socket() hasn't touched the network at all — no address, no port, no packet.
          It cannot possibly know anything about clients. That's accept()'s job, four
          days from now.
      - text: "-1 is success and 3 is an error code, like functions that return 0 on success"
        correct: false
        why: >
          Inverted, and it's a real confusion because POSIX has both conventions.
          Calls that *return a resource* (socket, open, accept) return the resource and
          use -1 for failure. Calls that only report status (pthread_create, most of
          the pthreads API) return 0 on success and an error number directly.
      - text: "-1 specifically means the kernel is out of memory"
        correct: false
        why: >
          -1 is generic on purpose. Collapsing every failure into one return value is
          exactly why errno exists as a second channel — one bit of "it broke" plus a
          separate "here's which way".

  - id: q2
    prompt: >
      Why is the fd from socket(AF_INET, SOCK_STREAM, 0) not yet listening or connected
      to anything — what's missing?
    options:
      - text: "It has no address. socket() allocates the object; bind()/connect() give it a role"
        correct: true
        why: >
          Allocate, then configure, then use — the three-step shape that repeats all
          over this API. Right now the kernel has a TCP socket in state CLOSED with no
          local address, no remote address, and nothing in its buffers.
      - text: "Nothing's missing — the kernel already picked an ephemeral port for it"
        correct: false
        why: >
          No port is reserved until bind(), or until connect() does an implicit bind on
          your behalf. Until then the socket owns no part of the port space, which is
          why two processes can both call socket() and neither conflicts.
      - text: "The protocol argument is 0, which leaves it unusable until you pass IPPROTO_TCP"
        correct: false
        why: >
          0 means "the default protocol for this family and type" — which for
          AF_INET + SOCK_STREAM is exactly IPPROTO_TCP. Passing it explicitly changes
          nothing. You'd only set it for exotic cases like raw ICMP sockets.
      - text: "It isn't backed by a file yet, and every fd ultimately refers to a file on disk"
        correct: false
        why: >
          An fd is a handle to any kernel object that implements the file interface —
          sockets, pipes, terminals, epoll instances, timers. No disk is involved. That
          unification is the best design decision in the whole API: read/write/close
          work on all of them.

  - id: q3
    prompt: If you called socket(AF_INET, SOCK_DGRAM, 0) instead, what changes about the guarantees?
    options:
      - text: "You lose reliability and ordering, but gain message boundaries: one send is one recv"
        correct: true
        why: >
          UDP datagrams can be dropped, duplicated, or arrive out of order, and nothing
          retransmits them. In exchange each datagram stays a discrete unit — the exact
          opposite of the byte-stream problem that will bite you on Day 6.
      - text: "Nothing changes until you call sendto() — the type only picks which functions are legal"
        correct: false
        why: >
          The type selects the transport protocol right there in socket(). The kernel
          builds a UDP socket, not a TCP one, from that call onward — different state
          machine, different everything.
      - text: "It's still reliable, just faster, because UDP skips the three-way handshake"
        correct: false
        why: >
          This conflates latency with delivery guarantee. Skipping the handshake is
          real, but there are also no acknowledgements and no retransmission, so the
          network is entirely free to drop your datagram and never tell you.
      - text: "You still get an ordered byte stream, just without connection setup"
        correct: false
        why: >
          Ordered byte stream is the one thing UDP is not. Datagrams preserve message
          boundaries precisely because there's no stream to order them into.

  - id: q4
    prompt: >
      A program calls socket() ten thousand times in a loop and never calls close().
      What actually runs out, and how does it show up?
    options:
      - text: "The fd table — you hit RLIMIT_NOFILE and socket() starts returning -1 with errno EMFILE"
        correct: true
        why: >
          Every fd is a slot in a per-process table with a hard ceiling (`ulimit -n`,
          often 1024 or 8192). The failure is quiet and late: nine thousand calls
          succeed, then everything fails at once — which is why "check the return value
          of every syscall" stops sounding paranoid. EMFILE is per-process; ENFILE is
          the system-wide table, and seeing that one means you've taken the whole box
          down, not just yourself.
      - text: "Nothing — a socket with no address bound holds no resources until you bind() it"
        correct: false
        why: >
          The kernel allocated a real structure the moment socket() returned: buffers,
          protocol state, a table slot. Unbound just means the address fields are
          empty. This is the fd-leak bug in a nutshell — it looks free because nothing
          visible happened.
      - text: "The ephemeral port range — 65535 ports means you run out of ports long before fds"
        correct: false
        why: >
          Plausible arithmetic, wrong stage. No port is reserved until bind() or
          connect(); these sockets never touched the port space. Port exhaustion is
          real, but it's a client-side problem you hit by opening lots of *connections*
          — and it's why TIME_WAIT shows up in your life later.
      - text: "Nothing — the kernel reclaims sockets that have no address once memory gets tight"
        correct: false
        why: >
          There's no garbage collector here. The fd is a reference the kernel assumes
          you still want; it's released when you close it or when the process exits.
          Process exit is the only cleanup you get for free, which is exactly why a
          long-lived server leaking fds is so much worse than a short script doing it.

  - id: q5
    prompt: >
      When Asio hands you `co_await socket.async_read_some(...)`, what has replaced the
      raw recv() call underneath?
    options:
      - text: "Nothing — it's still recv() on an fd from socket(); what Asio adds is knowing when to call it"
        correct: true
        why: >
          This is the whole point of Day 1. Asio owns an event loop (epoll on Linux,
          kqueue on BSD, IOCP on Windows) that watches the fd and resumes your
          coroutine once the kernel says data has arrived — then does the ordinary
          recv(). The abstraction you already use at work is a scheduler bolted on top
          of the exact three calls in this milestone.
      - text: "It's the same recv(), but Asio runs it on a worker thread so the blocking wait is off your coroutine"
        correct: false
        why: >
          That's the thread-pool model — real, and what some libraries genuinely do,
          but it's the design Asio exists to avoid. A thread parked in a blocking recv()
          costs you a stack and a context switch per connection; readiness notification
          costs you one epoll entry. This distinction is precisely why C10k was a
          named problem.
      - text: "io_uring replaced the socket API — modern async I/O submits operations directly, with no fd"
        correct: false
        why: >
          io_uring changed how you *submit and complete* work, not what you're
          operating on: its ops take the same fd from the same socket() call. Forty
          years in, the notification mechanism has been rewritten four times and the
          socket abstraction hasn't moved.
      - text: "Asio uses a userspace TCP stack to skip the syscall, which is where the speedup comes from"
        correct: false
        why: >
          Kernel-bypass stacks exist (DPDK, and the reason people say "userspace TCP"),
          but they're a specialist tool for line-rate packet processing, and Asio isn't
          one. Ordinary Asio is a thin, portable wrapper over the kernel's sockets.
