# Deploys the learning PWA to GitHub Pages.
#
# This is NOT milestone 11. That one is yours to build from scratch: a C++
# clean-clone → build → test → green pipeline. This file exists only so the phone
# app has somewhere to live, and it deliberately doesn't touch the C++ at all.
#
# Content-only changes (a new lesson .md + .quiz.yaml) go through the same path:
# push to main, this rebuilds, the app sees the new week on its next launch.
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'milestones/**/lessons/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      # Project Pages serve from /<repo>/, so the app has to be built for that base.
      - run: npm run build
        working-directory: app
        env:
          APP_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
